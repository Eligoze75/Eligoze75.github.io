project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
resources:
  - img
  - styles.css

website:
  title: "Elí Gonzalez"
  search: false
  navbar:
    background: light
    right:
      - href: index.qmd#projects
        text: Projects
      - href: about.qmd
        text: About
      - href: https://medium.com/@eligoze75
        text: Blog
        target: _blank

format:
  html:
    theme: cosmo
    toc: false
    anchor-sections: false
    # Load custom CSS with a version query so browsers and GitHub Pages pick up changes after deploy
    include-in-header:
      - text: |
          <link rel="stylesheet" href="styles.css?v=2" />
